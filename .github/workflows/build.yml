name: Build and test
on:
  push:
    branches: [main, improve-clock-runtime]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: gradle --no-daemon test build
      - name: Test Forge runtime
        run: |
          set -o pipefail
          gradle --no-daemon runGameTestServer | tee gametest-base.log
          grep -F 'All 9 required tests passed' gametest-base.log
      - name: Prepare audited Palladium test dependencies
        run: python tools/prepare_palladium_test.py
      - name: Test Palladium runtime
        run: |
          set -o pipefail
          gradle --no-daemon -PwithPalladium runGameTestServer | tee gametest-palladium.log
          grep -F 'All 9 required tests passed' gametest-palladium.log
      - uses: actions/upload-artifact@v4
        with:
          name: HeroClock-2.2.16
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/
            gametest-*.log
